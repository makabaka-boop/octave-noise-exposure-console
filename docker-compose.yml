services:
  api:
    build:
      context: ./api
    container_name: noise-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
    container_name: noise-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
